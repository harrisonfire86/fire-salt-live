<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire &amp; Salt Mining</title>
<link rel="icon" href="assets/fire.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#08080c; --card:#121218; --line:#26262f; --txt:#f2f2f7; --dim:#a3a6b5; --green:#2dff7a; --teal:#2dd4bf; --purple:#b57bff; --gold:#ffd27a; --blue:#4a8fe0; --pink:#ff6fb5; --red:#ff5a6e; --gm:'Bungee',system-ui,sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--txt); font-family:'Inter',system-ui,sans-serif; font-size:16px; }
body { padding-bottom:40px; }
#stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
#stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; opacity:.25; animation:tw 6s ease-in-out infinite; }
@keyframes tw { 50% { opacity:.7; } }
@media (prefers-reduced-motion: reduce) { #stars i, .line { animation:none !important; } }
.wrap { position:relative; z-index:1; max-width:560px; margin:0 auto; padding:0 16px; }
header { text-align:center; padding:18px 0 10px; }
.brand { display:flex; align-items:center; justify-content:center; gap:12px; }
.brand img { height:48px; width:auto; }
.fH { filter:drop-shadow(0 0 8px rgba(181,123,255,.7)); }
.fS { filter:drop-shadow(0 0 8px rgba(45,212,191,.7)); }
.title { font-family:var(--gm); font-size:28px; line-height:1; letter-spacing:.5px; }
.title .fire { background:linear-gradient(180deg,#ffe066 0%,#ff9a1f 45%,#ff3b1f 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 18px rgba(255,140,40,.35); }
.title .salt { color:#fff; text-shadow:0 0 14px rgba(160,230,255,.35); }
.sub { font-size:12px; color:var(--dim); letter-spacing:2px; margin-top:6px; font-weight:700; }
.line { height:3px; margin:12px 0 0; border-radius:3px; background:linear-gradient(90deg,#4a8fe0,#b57bff,#ff3b5c,#4a8fe0); background-size:200% 100%; animation:slide 6s linear infinite; }
@keyframes slide { to { background-position:200% 0; } }
.chips { display:flex; gap:8px; justify-content:center; margin:12px 0 4px; flex-wrap:wrap; }
.chip { background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:6px 10px; min-width:96px; text-align:center; }
.chip small { display:block; font-size:10px; color:var(--dim); font-weight:800; letter-spacing:1px; }
.chip b { font-size:15px; }
.card { background:var(--card); border:1.5px solid var(--c,var(--line)); border-radius:20px; padding:14px; margin:14px 0; box-shadow:0 0 16px color-mix(in srgb, var(--c,#000) 12%, transparent); }
.card h2 { margin:0 0 8px; font-size:18px; font-weight:800; display:flex; justify-content:space-between; align-items:center; gap:8px; }
details.card > summary { list-style:none; cursor:pointer; }
details.card > summary::-webkit-details-marker { display:none; }
details.card > summary h2::after { content:"+"; font-family:var(--gm); color:var(--c,#fff); font-size:24px; }
details.card[open] > summary h2::after { content:"\2013"; }
.big { font-family:var(--gm); font-size:30px; line-height:1.1; }
.dim { color:var(--dim); font-size:14px; }
.small { font-size:13px; color:var(--dim); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.stat { background:#0c0c11; border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
.stat small { display:block; font-size:11px; color:var(--dim); font-weight:700; }
.stat b { font-size:17px; }
.tag { display:inline-block; font-size:12px; font-weight:800; padding:3px 8px; border-radius:999px; background:#1d2a22; color:var(--green); margin-right:4px; }
.tag.bch { background:#16302a; color:var(--teal); }
.tag.solo { background:#2a1f3a; color:var(--purple); }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); margin-right:6px; }
.dot.off { background:#555; box-shadow:none; }
label { display:block; font-size:13px; color:var(--dim); font-weight:700; margin:10px 0 4px; }
input, select { width:100%; background:#0a0a0f; color:var(--txt); border:1.5px solid var(--line); border-radius:12px; padding:10px; font-size:16px; font-family:inherit; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.btn { display:inline-block; background:#1a1a22; color:var(--txt); border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; font-size:15px; font-weight:700; cursor:pointer; margin:10px 8px 0 0; font-family:inherit; }
.btn.go { background:var(--green); color:#04140a; border-color:var(--green); }
.btn.warn { border-color:var(--red); color:#ffb3bc; }
.msg { font-size:14px; color:var(--gold); margin-top:8px; min-height:1em; }
.list { margin-top:8px; }
.item { border-top:1px solid var(--line); padding:9px 0; }
.item > summary { list-style:none; display:flex; justify-content:space-between; gap:8px; cursor:pointer; }
.item > summary::-webkit-details-marker { display:none; }
.item .l { font-size:14px; }
.item .l small { display:block; color:var(--dim); font-size:12px; }
.item .r { text-align:right; font-weight:800; font-size:14px; white-space:nowrap; }
.item .r small { display:block; color:var(--dim); font-weight:600; font-size:12px; }
.math { font-size:13px; color:var(--dim); margin-top:6px; word-break:break-all; }
.tot { display:flex; justify-content:space-between; font-size:15px; padding:4px 0; }
.tot b { font-weight:800; }
.bar { height:12px; border-radius:6px; background:#22222a; overflow:hidden; margin:8px 0 4px; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,#ff5a6e,#ffb020); }
.bar i.done { background:var(--green); }
.status { font-size:13px; color:var(--dim); text-align:center; margin:16px 0; }
.viewOnly .full { display:none !important; }
textarea.copy { position:absolute; left:-9999px; }
.ladder { margin-top:8px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.lrow { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:7px 10px; border-top:1px solid #1c1c24; font-size:14px; }
.lrow:first-child { border-top:0; }
.lz { font-weight:800; min-width:72px; }
.lv { color:var(--dim); }
.lt { font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:#2a2418; color:var(--gold); }
.lrow.need { background:#1d2a22; }
.lrow.need .lt { background:var(--green); color:#04140a; }
.lrow.hit { background:#231d10; }
.skyCard { background:#0b0f22; border:2px solid #2f3240; border-radius:14px; padding:12px 12px 8px; margin:14px 0; }
.skyCard > summary { list-style:none; display:flex; align-items:center; gap:10px; cursor:pointer; margin:0 4px 4px; }
.skyCard > summary::-webkit-details-marker { display:none; }
.skyCard > summary::after { content:"+"; font-family:var(--gm); font-size:28px; line-height:1; color:#fff; margin-left:4px; }
.skyCard[open] > summary::after { content:"\2013"; margin-left:auto; }
.skyTitle { font-size:18px; font-weight:700; color:#f2f2f5; }
.skyBest { margin-left:auto; color:#ffd34d; font-weight:700; font-size:15px; }
.skyCard[open] .skyBest { display:none; }
.skyLuck { display:flex; justify-content:space-between; align-items:baseline; margin:6px 4px 4px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.12); }
.skyLuckLbl { font-size:16px; color:#a9abb8; }
.skyLuckNum { font-size:20px; font-weight:800; color:#f2f2f5; }
.skyPick { display:flex; flex-direction:column; align-items:center; gap:2px; margin:8px 4px 0; padding:8px; border:1px solid rgba(255,255,255,0.12); border-radius:10px; text-align:center; }
.skyPick b { font-size:17px; color:#ffd34d; }
.skyPick span { font-size:13px; color:#a9abb8; }
.skyPickT { font-size:11px !important; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
.skyNote { margin:6px 4px 2px; font-size:13px; color:#a9abb8; line-height:1.3; }
.chipsIn { display:contents; }
.chip small:last-child { font-size:12px; color:var(--dim); font-weight:700; letter-spacing:0; }
.chip.mining { border-color:var(--green); box-shadow:0 0 14px rgba(45,255,122,.35); }
.chip.mining small:first-child { color:var(--green); }
.chipBtn { background:#123020; border-color:var(--green); color:var(--green); cursor:pointer; font-family:inherit; }
.chipBtn b { color:var(--green); }
.chipBtn:disabled { opacity:.6; }
.ib { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; margin-left:4px; border-radius:50%; border:1.5px solid var(--teal); background:transparent; color:var(--teal); font-size:11px; font-weight:800; font-style:italic; font-family:Georgia,serif; cursor:pointer; vertical-align:middle; padding:0; }
.ib.on { background:var(--teal); color:#04140a; }
.ibBox { margin-top:8px; padding:10px; border:1px solid var(--teal); border-radius:10px; font-size:14px; color:#dfe6ea; background:#0d1a1a; }
.lnkHead { margin:12px 0 4px; font-size:12px; font-weight:800; letter-spacing:1px; color:var(--dim); text-transform:uppercase; }
.lnk { display:flex; justify-content:space-between; gap:8px; padding:9px 2px; border-top:1px solid var(--line); color:var(--txt); text-decoration:none; }
.lnk b { color:var(--teal); }
.lnk span { color:var(--dim); font-size:13px; text-align:right; }
</style>
</head>
<body>
<div id="stars"></div>
<div class="wrap">
  <header>
    <div class="brand">
      <img class="fH" alt="" src="assets/fire.png">
      <div class="title"><span class="fire">Fire</span> <span class="salt">&amp; Salt</span></div>
      <img class="fS" alt="" src="assets/salty.png">
    </div>
    <div class="sub">MINING</div>
    <div class="line"></div>
    <div class="chips"><span id="chips" class="chipsIn"></span><button class="chip chipBtn" type="button" id="checkNow"><small>&nbsp;</small><b>Check now</b><small>&nbsp;</small></button></div>
  </header>
  <main id="main"></main>
  <div class="status" id="status"></div>
</div>
<script src="page.js?v=13"></script>
<script src="private.js?v=13"></script>
</body>
</html>
