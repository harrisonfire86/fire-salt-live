name: Collect mining data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths:
      - config.json

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch pool stats and wallet payouts
        run: node scripts/collect.mjs
        env:
          SAMPLES: ${{ github.event_name == 'schedule' && '12' || '1' }}
      - name: Save the new data
        run: |
          git config user.name "fire-salt-bot"
          git config user.email "fire-salt-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: update"
          git pull --rebase
          git push
